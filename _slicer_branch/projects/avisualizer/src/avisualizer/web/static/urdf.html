<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URDF Viewer</title>
  <link rel="stylesheet" href="/static/urdf_viewer.css?v=8" />
</head>
<body>
  <div class="status-panel">
    <h1>URDF Viewer</h1>
    <p id="modelStatus">Model: loading...</p>
    <p id="meshStatus">Mesh: waiting...</p>
  </div>

  <div class="controls-panel">
    <h2>Controls</h2>

    <section class="control-subpanel">
      <h3>Model</h3>
      <div class="control-row">
        <label class="control-label" for="modelSelect">URDF</label>
        <select id="modelSelect" class="control-input">
          <option value="/assets/M600_PRO/M600_PRO.urdf" selected>Loading models...</option>
        </select>
      </div>
      <div class="control-row actions-row">
        <button id="reloadModel" type="button">Reload</button>
        <button id="resetView" type="button">Reset View</button>
        <button id="lightModeToggle" type="button">Light Mode: Off</button>
      </div>
    </section>

    <section class="control-subpanel">
      <h3>Transparency</h3>
      <div class="control-row">
        <label class="control-label" for="userStepTransparencyEnabled">User Step</label>
        <input id="userStepTransparencyEnabled" type="checkbox" aria-label="Enable User Step transparency" />
        <input
          id="userStepTransparency"
          class="transparency-slider"
          type="range"
          min="0"
          max="100"
          step="1"
          value="0"
          aria-label="User Step transparency"
        />
        <span id="userStepTransparencyValue" class="transparency-value">0%</span>
      </div>

      <div class="control-row">
        <label class="control-label" for="displayTransparencyEnabled">Display</label>
        <input id="displayTransparencyEnabled" type="checkbox" aria-label="Enable Display transparency" />
        <input
          id="displayTransparency"
          class="transparency-slider"
          type="range"
          min="0"
          max="100"
          step="1"
          value="0"
          aria-label="Display transparency"
        />
        <span id="displayTransparencyValue" class="transparency-value">0%</span>
      </div>

      <div class="control-row">
        <label class="control-label" for="headTransparencyEnabled">Head</label>
        <input id="headTransparencyEnabled" type="checkbox" aria-label="Enable Head transparency" />
        <input
          id="headTransparency"
          class="transparency-slider"
          type="range"
          min="0"
          max="100"
          step="1"
          value="0"
          aria-label="Head transparency"
        />
        <span id="headTransparencyValue" class="transparency-value">0%</span>
      </div>
    </section>

    <section class="control-subpanel">
      <h3>Feeder Drive</h3>
      <div class="control-row">
        <label class="control-label" for="feederDriveStop">Direction</label>
        <div class="drive-toggle-group" role="group" aria-label="Feeder drive spool selection">
          <button id="feederDriveLeft" type="button">Spool 1</button>
          <button id="feederDriveStop" type="button" class="active">Stop</button>
          <button id="feederDriveRight" type="button">Spool 2</button>
        </div>
      </div>
      <div class="control-row">
        <label class="control-label" for="feederDriveUp">Vertical</label>
        <div class="drive-toggle-group drive-toggle-group-two" role="group" aria-label="Feeder drive vertical direction">
          <button id="feederDriveUp" type="button">Up</button>
          <button id="feederDriveDown" type="button">Down</button>
        </div>
      </div>
    </section>

    <section class="control-subpanel">
      <h3>Feeder Camera</h3>
      <div class="annotation-nav-group" role="group" aria-label="Feeder camera anchors">
        <button id="feederCameraAnchorLeft" type="button" aria-pressed="false">Feeder Spool 1 View</button>
        <button id="feederCameraAnchorRight" type="button" aria-pressed="false">Feeder Spool 2 View</button>
      </div>
    </section>

    <section class="control-subpanel">
      <h3>Appearance</h3>
      <div class="control-row actions-row">
        <button id="wireDrumAppearButton" type="button">Wire Drum</button>
      </div>
    </section>

    <section class="control-subpanel">
      <h3>Assembly Shortcuts</h3>
      <div class="annotation-nav-group" role="group" aria-label="Assembly action shortcuts">
        <button id="annotationNavFrontDoor" type="button" aria-pressed="false">Front Door</button>
        <button id="annotationNavSpoolsDoor" type="button" aria-pressed="false">Materials</button>
        <button id="annotationNavTopCover" type="button" aria-pressed="false">Top Cover</button>
      </div>
    </section>

    <section class="control-subpanel">
      <h3>Joints</h3>
      <div id="jointControls" class="joint-controls">
        <p class="empty-state">No controllable joints detected.</p>
      </div>
    </section>
  </div>

  <div id="annotationLayer" class="annotation-layer" aria-hidden="true"></div>

  <canvas id="scene"></canvas>

  <script type="importmap">
    {
      "imports": {
        "three": "/static/vendor/three.module.js",
        "three/addons/": "/static/vendor/"
      }
    }
  </script>
  <script type="module" src="/static/urdf_viewer.js?v=94"></script>
</body>
</html>
