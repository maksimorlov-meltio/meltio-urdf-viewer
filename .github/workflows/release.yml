name: release

# Step-8 release channel: publishes the consumable frontend — the root hmi/
# and viewer/ partitions plus contract.json, contract-dom.json and
# contract-http.json — to the `release` branch, ONLY
# when the step-7 gate (gate.sh, nine checks) is green. Downstream consumers
# (the C# WPF host) track `release` as a read-only submodule; commits are
# appended (fast-forward friendly), one per published main commit, and nothing
# is published when the release content is unchanged.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  publish:
    name: gate + publish release branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend tooling
        run: npm ci
      - name: Gate (nine checks — publish is refused if any fails)
        run: bash gate.sh
      - name: Assemble and publish
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          SHORT=$(git rev-parse --short HEAD)

          STAGE=$(mktemp -d)
          # One command builds the whole artefact — page, styling, pinned three,
          # the published partitions, the assembly and the three contracts.
          # It used to be split with the workflow, and while it was, no test
          # could walk the artefact's import graph; the first one that did found
          # a module that would have 404'd on load.
          node tools/gen_artifact.mjs --out "$STAGE"
          cat > "$STAGE/README.md" <<EOF
          # Meltio HMI — release channel

          Auto-published snapshot of the running frontend, for read-only
          consumption (e.g. as a git submodule of the C# WPF host).

          **This is a page that runs, not a pile of parts.** Serve this folder
          over HTTP, give it the two things it does not carry, and you have the HMI. You do
          not have to write the assembly.

          - \`index.html\` + \`urdf_viewer.css\` + \`vendor/\` + \`icons/\` — the
            shell: every element id the modules look up and the stylesheet whose
            classes they toggle. \`vendor/\` is the pinned \`three\` the import
            map resolves to.
          - \`app.js\` — **the assembly**, and the entry \`index.html\` points at.
            It creates the Three.js scene, loads the URDF and instantiates every
            module below. It is the dev host's own \`urdf_viewer.js\`, shipped
            as-is rather than hidden, because an artefact you cannot run is not
            an artefact. Replace it only if you want your own assembly.
            \`modules/\` travels with it.

          - \`hmi/\` — UI-side ES modules (DOM, host state, transports). No
            \`three\` imports (CI-enforced boundary).
          - \`viewer/\` — scene-side ES modules (Three.js; DOM only under
            \`overlays/\`). \`three\` / \`three/addons/*\` are bare imports:
            the embedder provides them via an import map or bundler alias.
          - \`contract.json\` — the UI↔host message contract (v2, host-owned).
          - \`contract-http.json\` — the HTTP surface the embedder must provide.
            Generated from the backend, so it cannot drift: which routes exist,
            which of them a PUBLISHED module actually calls (\`calledBy\`
            non-empty — those you cannot skip), and which enforce authorisation
            SERVER-SIDE. Reimplementing one of those without its check moves the
            security boundary, it does not remove it.
          - \`contract-dom.json\` — what these modules need FROM the embedder:
            the element ids each looks up, and the dependency keys each
            \`initXxx\`/\`createXxx\` entry point reads. Every DOM lookup is
            guarded, so an embedder that supplies none of it gets a tree that
            loads cleanly and does nothing, in silence. Read this one first.

          ## What this branch does NOT carry, and you must supply

          - **\`/assets\`** — the URDF and its 24 \`.glb\` meshes (~140 MB, Git
            LFS on \`main\`). Without them the page loads and the scene is empty.
            The URDF names the meshes and the assembly binds to its link and
            joint names, so those two version together.
          - **The routes in \`contract-http.json\`** whose \`calledBy\` is not
            empty. \`tools/serve_artifact.py\` on \`main\` is a 73-line reference
            implementation of the split: static from the folder, those routes
            forwarded. That split IS the consuming architecture.

          Source: \`$SHA\` on \`main\` — do not edit this branch; changes land
          on \`main\` and are re-published by the \`release\` workflow after
          the nine-gate check (\`gate.sh\`).

          To check your own host against this: \`node tools/check_boot.mjs --url
          http://your-host/index.html\` on \`main\` loads the page in headless
          Chrome and fails on one console error, one unexpected failed request
          or a missing \`window.Meltio*\` bridge.
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          WT=$(mktemp -d)
          # Resolve FETCH_HEAD to a SHA *here*: a linked worktree has its own
          # git dir and cannot see this repo's FETCH_HEAD, so the previous
          # `git -C "$WT" checkout -B release FETCH_HEAD` died with "not a
          # commit". It never showed up because the first publish took the
          # orphan branch below — the update path had never run.
          if git fetch origin release 2>/dev/null; then
            RELEASE_TIP=$(git rev-parse FETCH_HEAD)
            git worktree add -B release "$WT" "$RELEASE_TIP"
          else
            git worktree add --detach "$WT"
            git -C "$WT" checkout --orphan release
            git -C "$WT" rm -rfq . 2>/dev/null || true
          fi

          find "$WT" -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +
          cp -r "$STAGE"/. "$WT"/

          git -C "$WT" add -A
          if git -C "$WT" diff --cached --quiet; then
            echo "release: content unchanged — nothing to publish."
            exit 0
          fi
          git -C "$WT" commit -m "release: hmi + viewer + contract from $SHORT"
          git -C "$WT" push origin release
          echo "release: published $SHORT to the release branch."
