name: ci

# Repo-level CI. The per-app workflows under urdf_viewer/.github and
# _slicer_branch/.github do NOT run for this repository (they live in
# subfolders); this is the one that does. It runs the same validation commands
# documented in CONTRIBUTING.md, so "green here" == "ran the contract".

on:
  pull_request:
  push:
    branches: [main]

jobs:
  viewer-python:
    name: viewer pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install viewer deps (without the heavy open3d 'pointcloud' extra)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./urdf_viewer/projects/avisualizer pytest==8.4.0 httpx==0.27.2
      - name: pytest
        run: python -m pytest urdf_viewer/projects/avisualizer/tests

  slicer-python:
    name: slicer pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install slicer deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./_slicer_branch/projects/platform pytest==8.4.0 httpx==0.27.2
      - name: pytest
        run: python -m pytest _slicer_branch/projects/platform/tests

  frontend-js:
    name: frontend js checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: node --check (own JS only, excluding vendored three.js)
        run: |
          find urdf_viewer/projects/avisualizer/src/avisualizer/web/static \
               _slicer_branch/projects/platform/src/meltio_platform/slicer/web/static \
               -name '*.js' -not -path '*/vendor/*' -print0 \
            | xargs -0 -r -n1 node --check
      - name: import-resolution gate
        run: node urdf_viewer/projects/avisualizer/tools/check_imports.mjs
      - name: frontend unit tests
        run: |
          node --test "urdf_viewer/projects/avisualizer/tests/js/**/*.test.mjs"
          node --test "_slicer_branch/projects/platform/tests/js/**/*.test.mjs"
