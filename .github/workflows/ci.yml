name: ci

# Repo-level CI. The per-app workflows under urdf_viewer/.github and
# _slicer_branch/.github do NOT run for this repository (they live in
# subfolders); this is the one that does. It runs the same validation commands
# documented in CONTRIBUTING.md, so "green here" == "ran the contract".

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # DO NOT RENAME OR SPLIT THIS JOB. "viewer pytest" is one of the three
  # required status checks on `main`. A required context that stops being
  # reported does not go red — it blocks EVERY merge, permanently, until someone
  # with repo-admin rights edits the branch protection. Nobody on this side has
  # those rights, so treat the job name as immutable.
  #
  # That is also why the boot check lives here instead of in a job of its own,
  # which is what its name would suggest: adding a new required context needs
  # the same admin rights, and a non-blocking gate is a suggestion. This one
  # exists precisely because nine advisory-in-practice signals let a dead
  # application reach main and stay there for two days.
  #
  # The arrangement is permanent, not a stopgap. What it costs: a boot failure
  # reads as "viewer pytest failed" until you open the log (the step name is
  # unambiguous), and this job is CI's long pole at ~1m40s instead of ~30s.
  # What it does NOT cost is coverage — see the !cancelled() note below.
  viewer-python:
    name: viewer pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install viewer deps (without the heavy open3d 'pointcloud' extra)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./apps/dev-host pytest==8.4.0 httpx==0.27.2
      - name: pytest
        run: python -m pytest apps/dev-host/tests
      # Boots the real viewer over HTTP and walks the operator journeys. Runs
      # viewer-only here (the slicer's native deps are not installed, so its two
      # journeys skip themselves) — enough to catch a dead app entry, which is
      # how finding ARQ-1 reached main with all three checks green.
      - name: pytest smoke (viewer-only)
        run: python -m pytest tests/smoke -v

      # --- Boot check ---------------------------------------------------------
      # The smoke tests above prove the SERVER answers. Only this proves the PAGE
      # runs: everything else in this workflow parses, lints and mounts modules in
      # isolation, which is how 515877b's module-killing TypeError survived two
      # days and nine merges with every check green. See tools/check_boot.mjs.
      #
      # Every step below carries `if: ${{ !cancelled() }}`. Without it a single
      # failing pytest would skip the boot check entirely and that PR would get
      # no arrival signal at all — the one real cost of living inside another
      # job instead of being its own required context (which needs repo-admin
      # rights nobody here has). With it, a red pytest and a red boot are
      # reported together, and the screenshot artifact is still produced.
      - uses: actions/setup-node@v4
        if: ${{ !cancelled() }}
        with:
          node-version: "22"
      # The 24 GLB meshes are ~140 MB of LFS. Downloading them on every PR would
      # burn the account's bandwidth quota in a handful of runs, so cache the
      # objects keyed on the pointer list (`ls-files` reads pointers, no fetch).
      - name: LFS pointer digest
        if: ${{ !cancelled() }}
        id: lfs
        run: echo "key=$(git lfs ls-files -l | sha256sum | cut -c1-40)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: ${{ !cancelled() }}
        with:
          path: .git/lfs
          key: lfs-${{ steps.lfs.outputs.key }}
      - name: Fetch the meshes
        if: ${{ !cancelled() }}
        run: git lfs pull
      # No AVIS_SLICER_URL: the slicer is optional (CLAUDE.md) and its proxy
      # answering 503 is the documented, allow-listed exception in check_boot.
      - name: Start the viewer
        if: ${{ !cancelled() }}
        run: |
          python -m uvicorn avisualizer.web.app:create_app \
            --factory --host 127.0.0.1 --port 8090 &
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8090/urdf >/dev/null && exit 0
            sleep 1
          done
          echo "the viewer never came up"; exit 1
      - name: Boot check (zero console errors, boot contract satisfied)
        if: ${{ !cancelled() }}
        run: node tools/check_boot.mjs --screenshot boot.png
      # Uploaded on failure too: a 1080x1920 shot of what the operator would see
      # is usually faster to read than the error list.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boot-screenshot
          path: boot.png
          if-no-files-found: ignore
      # Python dependency CVEs (finding SEG-9). Advisory for now: this scans the
      # resolved viewer environment, and a new advisory landing upstream must not
      # turn every unrelated PR red overnight. Read the log; promote to blocking
      # once the noise level is known.
      - name: pip-audit (advisory)
        continue-on-error: true
        run: |
          python -m pip install pip-audit==2.7.3
          python -m pip_audit --progress-spinner off

  slicer-python:
    name: slicer pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install slicer deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./_slicer_branch/projects/platform pytest==8.4.0 httpx==0.27.2
      - name: pytest
        run: python -m pytest _slicer_branch/projects/platform/tests

  frontend-js:
    name: frontend js checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # First, not last: the unit-test step below needs node_modules (jsdom for
      # the DOM-level tests), and eslint needs it too. gate.sh already assumes
      # it is present.
      - name: Install frontend tooling
        run: npm ci
      - name: node --check (own JS only, excluding vendored three.js)
        run: |
          find hmi viewer apps/dev-host/src/avisualizer/web/static \
               _slicer_branch/projects/platform/src/meltio_platform/slicer/web/static \
               -name '*.js' -not -path '*/vendor/*' -print0 \
            | xargs -0 -r -n1 node --check
      - name: Import-resolution gate (see CONTRIBUTING.md)
        run: node tools/check_imports.mjs
      - name: Contract gate (every emitted command declared in contract.json)
        run: node tools/check_contract.mjs
      - name: Boundary gate (hmi/ no-three, viewer/ no-DOM outside overlays, export let census)
        run: node tools/check_boundaries.mjs
      # Runs against the COMMITTED urdf.html, before the build step below
      # rewrites it to the (gitignored) bundle. See finding ARQ-1.
      - name: Entry gate (urdf.html references only tracked files)
        run: node tools/check_entry.mjs
      # The published artefact's other half: which DOM ids and injected deps the
      # hmi/ + viewer/ modules require of an embedder (finding ARQ-3).
      - name: DOM-contract gate (contract-dom.json is regenerated and unchanged)
        run: |
          node tools/gen_dom_contract.mjs
          git diff --exit-code -- contract-dom.json
      # Every getElementById is guarded, so an element that was never added to
      # the page fails silently forever. Ratchet: the known ones are listed, new
      # ones fail.
      - name: Dead-lookup gate (no new lookups without an element)
        run: node tools/check_dead_lookups.mjs
      - name: Viewer JS unit tests (pure hmi/ + viewer/ modules)
        run: npm test
      - name: Lint & build (frontend, repo root)
        run: |
          npm run lint
          npm run build
      # Dependency CVEs (finding SEG-9): nothing was audited on either side.
      # `--omit=dev` would leave nothing to scan (every dep here is a dev tool),
      # so audit the lot and fail on high/critical only. One moderate is knowingly
      # left standing: esbuild's dev-SERVER request bypass, which needs a
      # semver-major bump and does not apply — build.mjs calls build()
      # programmatically and never starts `esbuild serve`.
      - name: npm audit (high and above)
        run: npm audit --audit-level=high

