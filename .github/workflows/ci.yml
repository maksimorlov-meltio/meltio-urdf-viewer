name: ci

# Repo-level CI. The per-app workflows under urdf_viewer/.github and
# _slicer_branch/.github do NOT run for this repository (they live in
# subfolders); this is the one that does. It runs the same validation commands
# documented in CONTRIBUTING.md, so "green here" == "ran the contract".

on:
  pull_request:
  push:
    branches: [main]

jobs:
  viewer-python:
    name: viewer pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install viewer deps (without the heavy open3d 'pointcloud' extra)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./apps/dev-host pytest==8.4.0 httpx==0.27.2
      - name: pytest
        run: python -m pytest apps/dev-host/tests
      # Boots the real viewer over HTTP and walks the operator journeys. Runs
      # viewer-only here (the slicer's native deps are not installed, so its two
      # journeys skip themselves) — enough to catch a dead app entry, which is
      # how finding ARQ-1 reached main with all three checks green.
      - name: pytest smoke (viewer-only)
        run: python -m pytest tests/smoke -v
      # Python dependency CVEs (finding SEG-9). Advisory for now: this scans the
      # resolved viewer environment, and a new advisory landing upstream must not
      # turn every unrelated PR red overnight. Read the log; promote to blocking
      # once the noise level is known.
      - name: pip-audit (advisory)
        continue-on-error: true
        run: |
          python -m pip install pip-audit==2.7.3
          python -m pip_audit --progress-spinner off

  slicer-python:
    name: slicer pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install slicer deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./_slicer_branch/projects/platform pytest==8.4.0 httpx==0.27.2
      - name: pytest
        run: python -m pytest _slicer_branch/projects/platform/tests

  frontend-js:
    name: frontend js checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # First, not last: the unit-test step below needs node_modules (jsdom for
      # the DOM-level tests), and eslint needs it too. gate.sh already assumes
      # it is present.
      - name: Install frontend tooling
        run: npm ci
      - name: node --check (own JS only, excluding vendored three.js)
        run: |
          find hmi viewer apps/dev-host/src/avisualizer/web/static \
               _slicer_branch/projects/platform/src/meltio_platform/slicer/web/static \
               -name '*.js' -not -path '*/vendor/*' -print0 \
            | xargs -0 -r -n1 node --check
      - name: Import-resolution gate (see CONTRIBUTING.md)
        run: node tools/check_imports.mjs
      - name: Contract gate (every emitted command declared in contract.json)
        run: node tools/check_contract.mjs
      - name: Boundary gate (hmi/ no-three, viewer/ no-DOM outside overlays)
        run: node tools/check_boundaries.mjs
      # Runs against the COMMITTED urdf.html, before the build step below
      # rewrites it to the (gitignored) bundle. See finding ARQ-1.
      - name: Entry gate (urdf.html references only tracked files)
        run: node tools/check_entry.mjs
      # The published artefact's other half: which DOM ids and injected deps the
      # hmi/ + viewer/ modules require of an embedder (finding ARQ-3).
      - name: DOM-contract gate (contract-dom.json is regenerated and unchanged)
        run: |
          node tools/gen_dom_contract.mjs
          git diff --exit-code -- contract-dom.json
      - name: Viewer JS unit tests (pure hmi/ + viewer/ modules)
        run: node --test "tests/js/**/*.test.mjs"
      - name: Lint & build (frontend, repo root)
        run: |
          npm run lint
          npm run build
      # Dependency CVEs (finding SEG-9): nothing was audited on either side.
      # `--omit=dev` would leave nothing to scan (every dep here is a dev tool),
      # so audit the lot and fail on high/critical only. One moderate is knowingly
      # left standing: esbuild's dev-SERVER request bypass, which needs a
      # semver-major bump and does not apply — build.mjs calls build()
      # programmatically and never starts `esbuild serve`.
      - name: npm audit (high and above)
        run: npm audit --audit-level=high
