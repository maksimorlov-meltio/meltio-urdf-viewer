[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "avisualizer"
version = "0.1.0"
description = "Web-first sensor point-cloud visualizer for process intelligence"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "numpy>=1.26.0,<3.0.0",
  "uvicorn>=0.30.0,<1.0.0"
]
authors = [
  { name = "Process Intelligence Team" }
]

[project.optional-dependencies]
pointcloud = [
  "open3d>=0.19.0,<1.0.0"
]

[project.scripts]
avisualizer = "avisualizer.web.app:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
