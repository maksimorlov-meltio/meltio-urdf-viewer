<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sensor Point Cloud Viewer</title>
  <link rel="stylesheet" href="/static/styles.css?v=37" />
</head>
<body>
  <button id="openSettings" class="settings-button" type="button">Settings</button>

  <div class="color-scale-panel" id="colorScalePanel" aria-label="Load cell color scale">
    <div class="color-scale-wrap">
      <div class="color-scale-bar" id="colorScaleBar"></div>
      <div class="color-scale-labels">
        <span id="colorScaleMax">max</span>
        <span id="colorScaleAvg">avg</span>
        <span id="colorScaleMin">min</span>
      </div>
    </div>
  </div>

  <div class="status-panel">
    <h1>Sensor Viewer</h1>
    <p id="partStatus">loading...</p>
    <p id="attributeStatus">loading...</p>
  </div>

  <div class="controls-panel">
    <h2>Controls</h2>

    <section class="control-subpanel">
      <h3>File</h3>
      <div class="control-row">
        <label class="control-label" for="selectFolder">Source</label>
        <button class="control-input" id="selectFolder" type="button">Load Folder</button>
      </div>
      <input id="folderPicker" type="file" webkitdirectory directory multiple hidden />
      <p id="fileStatus" class="file-status">Default: small-torture-test_1-0-0</p>
    </section>

    <section class="control-subpanel">
      <h3>View</h3>
      <div class="control-row">
        <label class="control-label" for="viewMode">View Mode</label>
        <select class="control-input" id="viewMode">
          <option value="point_sprite" selected>Point Cloud (Sprite)</option>
          <option value="voxel_sprite">Voxel Sprite</option>
          <option value="voxel_cube">Voxel (Cubes)</option>
        </select>
      </div>
    </section>

    <section class="control-subpanel cut-subpanel">
      <h3>Cut</h3>

      <div class="control-row">
        <label class="control-label" for="cutXMin">X Cut</label>
        <div class="dual-range" aria-label="X cut range">
          <input id="cutXMin" type="range" min="0" max="100" step="1" value="0" />
          <input id="cutXMax" type="range" min="0" max="100" step="1" value="100" />
        </div>
      </div>

      <div class="control-row">
        <label class="control-label" for="cutYMin">Y Cut</label>
        <div class="dual-range" aria-label="Y cut range">
          <input id="cutYMin" type="range" min="0" max="100" step="1" value="0" />
          <input id="cutYMax" type="range" min="0" max="100" step="1" value="100" />
        </div>
      </div>

      <div class="control-row">
        <label class="control-label" for="cutZMin">Z Cut</label>
        <div class="dual-range" aria-label="Z cut range">
          <input id="cutZMin" type="range" min="0" max="100" step="1" value="0" />
          <input id="cutZMax" type="range" min="0" max="100" step="1" value="100" />
        </div>
      </div>

      <div class="control-row">
        <label class="control-label" for="cutValueMin">Value Cut</label>
        <div class="dual-range" aria-label="Value cut range">
          <input id="cutValueMin" type="range" min="0" max="100" step="1" value="0" />
          <input id="cutValueMax" type="range" min="0" max="100" step="1" value="100" />
        </div>
      </div>
    </section>
  </div>

  <div id="settingsPanel" class="settings-panel hidden">
    <div class="settings-header">
      <h2>Settings</h2>
      <button id="closeSettings" type="button">Close</button>
    </div>

    <div class="tab-content">
      <section class="settings-group">
        <h3>Render Settings</h3>
        <label for="voxelSize">Voxel Size XY (mm)</label>
        <input id="voxelSize" type="number" min="0.1" max="20" step="0.1" value="2.0" />

        <label for="voxelSizeZ">Voxel Size Z (mm)</label>
        <input id="voxelSizeZ" type="number" min="0.1" max="20" step="0.1" value="1.2" />

        <label for="spriteSize">Sprite Size</label>
        <input id="spriteSize" type="number" min="0.5" max="8" step="0.1" value="4.25" />
      </section>

      <section class="settings-group">
        <h3>Buildplate Settings</h3>

        <label for="buildPlateSizeX">Build Plate Size X (mm)</label>
        <input id="buildPlateSizeX" type="number" min="10" max="2000" step="1" value="300" />

        <label for="buildPlateSizeY">Build Plate Size Y (mm)</label>
        <input id="buildPlateSizeY" type="number" min="10" max="2000" step="1" value="400" />

        <label for="showBaseGrid">Show Base Grid</label>
        <input id="showBaseGrid" type="checkbox" checked />
      </section>

      <section class="settings-group">
        <h3>Data Refinement</h3>

        <label for="percentileMin">Lower Percentile (%)</label>
        <input id="percentileMin" type="number" min="0" max="49" step="0.5" value="1" />

        <label for="percentileMax">Upper Percentile (%)</label>
        <input id="percentileMax" type="number" min="51" max="100" step="0.5" value="99" />

        <label for="fillVoxelizedGaps">Fill Voxilized Gaps</label>
        <input id="fillVoxelizedGaps" type="checkbox" />

        <label for="minVoxelHoleArea">Min Voxel Hole Area (mm2)</label>
        <input id="minVoxelHoleArea" type="number" min="0" max="200" step="0.5" value="5" />

        <label for="stlVoxelFill">STL Voxel Fill</label>
        <input id="stlVoxelFill" type="checkbox" />

        <label for="stlFillThreshold">STL Fill Threshold (0-1)</label>
        <input id="stlFillThreshold" type="number" min="0.5" max="1" step="0.05" value="0.8" />
      </section>

      <div class="settings-actions">
        <button id="applySettings" type="button">Apply</button>
      </div>
    </div>
  </div>

  <div class="trend-panel">
    <canvas id="trendCanvas" width="520" height="140"></canvas>
  </div>

  <canvas id="scene"></canvas>
  <script type="importmap">
    {
      "imports": {
        "three": "/static/vendor/three.module.js",
        "three/addons/": "/static/vendor/"
      }
    }
  </script>
  <script type="module" src="/static/app.js?v=85"></script>
</body>
</html>
