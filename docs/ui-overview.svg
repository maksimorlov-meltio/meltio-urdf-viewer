<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" font-family="'IBM Plex Sans','Segoe UI',system-ui,sans-serif" role="img" aria-label="Meltio URDF Viewer operator interface overview">
  <defs>
    <radialGradient id="floor" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#26262b"/>
      <stop offset="100%" stop-color="#141416"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1000" height="660" rx="16" fill="#141416"/>

  <!-- ===== 3D scene ===== -->
  <rect x="0" y="72" width="1000" height="484" fill="url(#floor)"/>
  <g stroke="#2c2c31" stroke-width="1">
    <line x1="120" y1="470" x2="880" y2="470"/>
    <line x1="180" y1="510" x2="820" y2="510"/>
    <line x1="240" y1="300" x2="240" y2="470"/>
    <line x1="500" y1="290" x2="500" y2="510"/>
    <line x1="760" y1="300" x2="760" y2="470"/>
  </g>

  <!-- gantry frame -->
  <g stroke="#5b5b63" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M300 150h400"/>
    <path d="M300 150v320"/>
    <path d="M700 150v320"/>
    <path d="M255 470h490"/>
  </g>

  <!-- deposition head -->
  <g>
    <rect x="462" y="155" width="76" height="58" rx="6" fill="#1f1f24" stroke="#7a7a82" stroke-width="3"/>
    <path d="M488 213l12 26 12-26z" fill="#26262b" stroke="#7a7a82" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="500" cy="242" r="5.5" fill="#f0913a"/>
    <circle cx="500" cy="242" r="11" fill="none" stroke="#f0913a" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- build plate + part -->
  <ellipse cx="500" cy="430" rx="150" ry="30" fill="#1c1c20" stroke="#5b5b63" stroke-width="3"/>
  <path d="M470 425c0-30 60-30 60 0v-70c0-24 -60 -24 -60 0z" fill="#242429" stroke="#8a8a92" stroke-width="2.5"/>
  <ellipse cx="500" cy="355" rx="30" ry="9" fill="#2f2f35" stroke="#8a8a92" stroke-width="2.5"/>

  <text x="500" y="545" text-anchor="middle" fill="#6f6f74" font-size="15">M600-PRO — live machine render + in-scene print simulation</text>

  <!-- ===== top bar ===== -->
  <rect x="0" y="0" width="1000" height="72" fill="#18181b"/>
  <line x1="0" y1="72" x2="1000" y2="72" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
  <rect x="26" y="20" width="32" height="32" rx="7" fill="none" stroke="#f0913a" stroke-width="2.5"/>
  <path d="M34 44l8-16 8 16" fill="none" stroke="#f0913a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="72" y="37" fill="#f2f2f2" font-size="17" font-weight="500">Meltio M600</text>
  <text x="72" y="55" fill="#8a8a92" font-size="12.5">Operator viewer</text>

  <!-- top-right utility icons -->
  <g stroke="#c7c7cd" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- fan -->
    <g transform="translate(720,24)">
      <circle cx="12" cy="12" r="2.2"/>
      <path d="M12 10c-1-4 1-8 4-8 2 3 0 6-4 8"/>
      <path d="M14 12c4-1 8 1 8 4-3 2-6 0-8-4"/>
      <path d="M12 14c1 4-1 8-4 8-2-3 0-6 4-8"/>
      <path d="M10 12c-4 1-8-1-8-4 3-2 6 0 8 4"/>
    </g>
    <!-- chiller / snowflake -->
    <g transform="translate(775,24)">
      <path d="M12 2v20M4 7l16 10M20 7L4 17"/>
    </g>
    <!-- bell -->
    <g transform="translate(830,24)">
      <path d="M6 16h12l-1.6-2.4V10a4.4 4.4 0 0 0-8.8 0v3.6z"/>
      <path d="M10.5 19a1.6 1.6 0 0 0 3 0"/>
    </g>
    <!-- gear -->
    <g transform="translate(885,24)">
      <circle cx="12" cy="12" r="3.4"/>
      <path d="M12 3.5v3M12 17.5v3M3.5 12h3M17.5 12h3M6 6l2.1 2.1M15.9 15.9 18 18M18 6l-2.1 2.1M8.1 15.9 6 18"/>
    </g>
  </g>
  <!-- account chip -->
  <circle cx="955" cy="36" r="15" fill="#f0913a"/>
  <text x="955" y="41" text-anchor="middle" fill="#141416" font-size="13" font-weight="600">OP</text>

  <!-- ===== bottom navigation ===== -->
  <rect x="0" y="556" width="1000" height="104" fill="#141416"/>
  <line x1="0" y1="556" x2="1000" y2="556" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>

  <!-- Open Door (inactive) -->
  <g transform="translate(105,574) scale(1.667)" fill="none" stroke="#9a9aa1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 3h12v18H6z"/><circle cx="14.5" cy="12" r="0.9" fill="#9a9aa1" stroke="none"/>
  </g>
  <text x="125" y="638" text-anchor="middle" fill="#9a9aa1" font-size="15">Open Door</text>

  <!-- Top Door (inactive) -->
  <g transform="translate(355,574) scale(1.667)" fill="none" stroke="#9a9aa1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 11L12 5L20 11Z"/><path d="M6 11H18V21H6Z"/><path d="M10 21V15.5H14V21"/>
  </g>
  <text x="375" y="638" text-anchor="middle" fill="#9a9aa1" font-size="15">Top Door</text>

  <!-- Materials (ACTIVE) -->
  <g transform="translate(605,574) scale(1.667)" fill="none" stroke="#f0913a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="11.5" cy="14" r="6.6"/><path d="M15.88 12.99A4.5 4.5 0 1 1 14.21 10.41"/><circle cx="11.5" cy="14" r="2.5"/>
    <path d="M17.03 10.41V1.8"/>
  </g>
  <text x="625" y="638" text-anchor="middle" fill="#f2f2f2" font-size="15" font-weight="500">Materials</text>
  <rect x="595" y="650" width="60" height="3" rx="1.5" fill="#f0913a"/>

  <!-- Files (inactive) -->
  <g transform="translate(855,574) scale(1.667)" fill="none" stroke="#9a9aa1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 7a1.6 1.6 0 0 1 1.6-1.6h3.2l1.8 2.2h7.8A1.6 1.6 0 0 1 20 9.2V18a1.6 1.6 0 0 1-1.6 1.6H5.6A1.6 1.6 0 0 1 4 18V7Z"/>
  </g>
  <text x="875" y="638" text-anchor="middle" fill="#9a9aa1" font-size="15">Files</text>
</svg>
